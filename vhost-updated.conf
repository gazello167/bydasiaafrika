# ==================================================
# EXISTING VHOST - WWW REDIRECT
# ==================================================
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.bydasiaafrika.com;
  return 301 https://bydasiaafrika.com$request_uri;
}

# ==================================================
# EXISTING VHOST - MAIN SITE (with Varnish)
# ==================================================
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name bydasiaafrika.com www1.bydasiaafrika.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }

  if (-f $request_filename) {
    break;
  }
}

# ==================================================
# VARNISH BACKEND - MAIN SITE
# ==================================================
server {
  listen 8080;
  listen [::]:8080;
  server_name bydasiaafrika.com www1.bydasiaafrika.com;
  {{root}}

  include /etc/nginx/global_settings;

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  if (-f $request_filename) {
    break;
  }
}

# ==================================================
# NEW - ADMIN SUBDOMAIN (no cache, direct to PHP-FPM)
# ==================================================
server {
  listen 80;
  listen [::]:80;
  server_name admin.bydasiaafrika.com;
  
  # Force HTTPS redirect
  return 301 https://$host$request_uri;
}

server {
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  
  # Use same SSL certificate as main domain
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  
  server_name admin.bydasiaafrika.com;
  
  # Root directory - point to admin folder
  root /home/bydasiaafrika/htdocs/bydasiaafrika.com/admin;
  
  # Logs
  access_log /home/bydasiaafrika/logs/admin-bydasiaafrika-access.log;
  error_log /home/bydasiaafrika/logs/admin-bydasiaafrika-error.log;
  
  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  
  # Disable caching for admin
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  
  # Index files
  index index.php index.html;
  
  # Let's Encrypt verification
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }
  
  # Block access to sensitive directories
  location ~ /(config|includes|db)/ {
    deny all;
    return 404;
  }
  
  # Block hidden files
  location ~ /\.(ht|svn|git|env) {
    deny all;
    return 404;
  }
  
  # API endpoints
  location /api/ {
    try_files $uri $uri/ =404;
    
    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_intercept_errors on;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      try_files $uri =404;
      fastcgi_read_timeout 300;
      fastcgi_send_timeout 300;
      fastcgi_param HTTPS "on";
      fastcgi_param SERVER_PORT 443;
      fastcgi_pass 127.0.0.1:{{php_fpm_port}};
      fastcgi_param PHP_VALUE "{{php_settings}}
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300";
    }
  }
  
  # Main location - PHP processing
  location / {
    try_files $uri $uri/ /index.php?$query_string;
    
    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_intercept_errors on;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      try_files $uri =404;
      fastcgi_read_timeout 300;
      fastcgi_send_timeout 300;
      fastcgi_param HTTPS "on";
      fastcgi_param SERVER_PORT 443;
      fastcgi_pass 127.0.0.1:{{php_fpm_port}};
      fastcgi_param PHP_VALUE "{{php_settings}}
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300";
    }
  }
  
  # Static assets for admin UI
  location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    access_log off;
  }
}
