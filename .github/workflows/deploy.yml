name: Auto Deploy Astro Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies & build
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # 4. Deploy dist/ ke server via rsync
      - name: Deploy dist/ ke VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --chown=bydasiaafrika:bydasiaafrika
          path: dist/
          remote_path: /home/bydasiaafrika/htdocs/bydasiaafrika.com/dist/
          remote_host: 43.157.209.144
          remote_user: bydasiaafrika
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 22

      # 5. Sync src/data ke VPS (untuk CMS)
      # Exclude file yang di-edit via CMS agar tidak tertimpa
      - name: Sync src/data ke VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --chown=bydasiaafrika:bydasiaafrika --exclude='site.ts' --exclude='models.ts' --exclude='slides.ts'
          path: src/data/
          remote_path: /home/bydasiaafrika/htdocs/bydasiaafrika.com/src/data/
          remote_host: 43.157.209.144
          remote_user: bydasiaafrika
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 22
