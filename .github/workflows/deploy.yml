name: Auto Deploy Astro Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS CloudPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.209.144
          username: bydasiaafrika
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/bydasiaafrika/htdocs/bydasiaafrika.com

            # Lindungi file data hasil generate CMS (models.ts, slides.ts, site.ts) agar tidak bentrok saat git pull
            git stash push -m "cms-data" -- src/data/ || true
            git pull origin main
            git stash pop || true

            npm install --prefer-offline
            npm run build